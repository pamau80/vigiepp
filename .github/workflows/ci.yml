name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r forense/requirements.txt
          pip install pytest httpx ruff bandit

      - name: Ruff
        run: ruff check backend/app tests --ignore E501

      - name: Ruff Forense (archivos P0)
        run: ruff check forense/app/path_safety.py forense/app/license.py forense/tests/test_security_forense.py --ignore E501

      - name: Bandit
        run: |
          bandit -q -r backend/app -x tests -lll
          bandit -q -r forense/app -lll

      - name: Install Node (ESLint frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ESLint frontend
        run: |
          npm ci
          npm run lint

      - name: Run pytest
        run: |
          pytest tests/ forense/tests/ -v --tb=short --ignore=tests/e2e --ignore=forense/tests/e2e
        env:
          VIGIEPP_COMBINED_INFERENCE: "0"
          VIGIEPP_FORENSE: "1"
          VIGIEPP_FORENSE_LICENSE: dev

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-playwright
          playwright install --with-deps chromium

      - name: Browser E2E (Playwright)
        run: |
          pytest tests/e2e/test_browser_core.py::test_browser_login_and_build \
            tests/e2e/test_browser_core.py::test_browser_navigate_personas_tab \
            tests/e2e/test_browser_identity.py \
            tests/e2e/test_browser_operator.py \
            tests/e2e/test_browser_actions.py \
            -v --tb=short
          pytest tests/e2e/test_browser_core.py::test_browser_enroll_photos_in_ui -v --tb=short
        env:
          VIGIEPP_COMBINED_INFERENCE: "0"
