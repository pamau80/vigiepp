name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx ruff bandit

      - name: Ruff
        run: ruff check backend/app tests --ignore E501

      - name: Bandit
        run: bandit -q -r backend/app -x tests

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          VIGIEPP_COMBINED_INFERENCE: "0"
