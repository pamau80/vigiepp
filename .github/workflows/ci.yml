name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx ruff bandit

      - name: Ruff
        run: ruff check backend/app tests --ignore E501

      - name: Bandit
        run: bandit -q -r backend/app -x tests -lll

      - name: Install Node (ESLint frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ESLint frontend
        run: |
          npm ci
          npm run lint

      - name: Run pytest
        run: pytest tests/ -v --tb=short --ignore=tests/e2e
        env:
          VIGIEPP_COMBINED_INFERENCE: "0"

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true

  docker-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config -q

      - name: Build edge image (CI, sin pesos)
        run: |
          docker build \
            --build-arg SKIP_MODEL_DOWNLOAD=1 \
            -t vigiepp-edge:ci \
            .

      - name: Smoke /api/health
        run: |
          docker run -d --name vigiepp-ci \
            -e VIGIEPP_AUTH=0 \
            -e VIGIEPP_EPHEMERAL=0 \
            -e VIGIEPP_DATA_DIR=/data \
            -e VIGIEPP_COMBINED_INFERENCE=0 \
            -e ULTRALYTICS_OFFLINE=true \
            -p 18000:8000 \
            vigiepp-edge:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/api/health -o /tmp/health.json; then
              python3 -c "
import json
d=json.load(open('/tmp/health.json'))
assert d.get('status')=='ok', d
assert d.get('build')=='v68', d
print('OK build', d['build'], 'release', (d.get('excellence') or {}).get('release'))
"
              docker rm -f vigiepp-ci
              exit 0
            fi
            sleep 2
          done
          docker logs vigiepp-ci || true
          docker rm -f vigiepp-ci || true
          exit 1

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-playwright
          playwright install --with-deps chromium

      - name: Browser E2E (Playwright)
        run: |
          pytest tests/e2e/test_browser_core.py::test_browser_login_and_build \
            tests/e2e/test_browser_core.py::test_browser_navigate_personas_tab \
            tests/e2e/test_browser_identity.py \
            tests/e2e/test_browser_operator.py \
            tests/e2e/test_browser_actions.py \
            -v --tb=short
          pytest tests/e2e/test_browser_core.py::test_browser_enroll_photos_in_ui -v --tb=short
        env:
          VIGIEPP_COMBINED_INFERENCE: "0"
