# VigiEPP en Render
# Free + volumen durable HF (activate-free-durable.ps1) = sin pago extra.
# Starter+disk opcional solo si querés disco nativo.

services:
  - type: web
    name: vigiepp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: VIGIEPP_DATA_DIR
        value: /data
      - key: VIGIEPP_AUTH
        value: "1"
      - key: VIGIEPP_COOKIE_SECURE
        value: "1"
      - key: VIGIEPP_ADMIN_PIN
        sync: false
      - key: VIGIEPP_OPERATOR_PIN
        sync: false
      - key: ULTRALYTICS_OFFLINE
        value: "false"
      - key: VIGIEPP_HF_TOKEN
        sync: false
      - key: VIGIEPP_HF_REPO
        sync: false
      - key: VIGIEPP_HF_FILE
        value: identity-backup.zip
      - key: HF_TOKEN
        sync: false
      - key: VIGIEPP_EPHEMERAL
        value: "1"
