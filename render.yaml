# VigiEPP en Render (reemplazo de Railway)
# Blueprint: https://dashboard.render.com/blueprints
#
# Primer build ~15–25 min (PyTorch + modelos).
# Plan Starter + disco = datos permanentes (recomendado).
# Plan Free: el disco se borra al sleep → configurá cloud backup:
#   VIGIEPP_CLOUD_TOKEN + VIGIEPP_CLOUD_REPO (repo PRIVADO)
#   y/o usá el auto-backup del navegador (IndexedDB).

services:
  - type: web
    name: vigiepp
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: VIGIEPP_DATA_DIR
        value: /data
      - key: VIGIEPP_AUTH
        value: "1"
      - key: VIGIEPP_COOKIE_SECURE
        value: "1"
      - key: VIGIEPP_ADMIN_PIN
        sync: false
      - key: VIGIEPP_OPERATOR_PIN
        value: porteria
      - key: ULTRALYTICS_OFFLINE
        value: "false"
      # En Free poné "1". En Starter+disco poné "0" o borrá la var.
      - key: VIGIEPP_EPHEMERAL
        value: "1"
      # Repo PRIVADO solo para backups (ej. pamau80/vigiepp-data)
      - key: VIGIEPP_CLOUD_REPO
        sync: false
      - key: VIGIEPP_CLOUD_TOKEN
        sync: false
      - key: VIGIEPP_CLOUD_PATH
        value: vigiepp-identity-backup.zip
    disk:
      name: vigiepp-data
      mountPath: /data
      sizeGB: 2
